<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FocusNest</title>
    <style>
        :root {
            --bg: linear-gradient(160deg, #e8f5ee, #f6efe3 55%, #fbe9e1);
            --card: rgba(255, 255, 255, .82);
            --ink: #22313a;
            --mute: #66757f;
            --acc: #3f8f6b;
            --acc2: #dff1e7;
            --line: #dcdad0;
            --warm: #f2b94b;
            --in: #fff;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: linear-gradient(160deg, #111a1a, #1a1d27 60%, #221a22);
                --card: rgba(36, 44, 52, .85);
                --ink: #e8edf0;
                --mute: #9aa7b0;
                --acc: #5cc293;
                --acc2: #1f3a2e;
                --line: #35404a;
                --warm: #e0a93a;
                --in: #1a2128
            }
        }

        :root[data-theme="dark"] {
            --bg: linear-gradient(160deg, #111a1a, #1a1d27 60%, #221a22);
            --card: rgba(36, 44, 52, .85);
            --ink: #e8edf0;
            --mute: #9aa7b0;
            --acc: #5cc293;
            --acc2: #1f3a2e;
            --line: #35404a;
            --warm: #e0a93a;
            --in: #1a2128
        }

        html {
            height: 100%;
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100%;
            background: var(--bg) fixed;
            color: var(--ink);
            font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
        }

        .wrap {
            max-width: 580px;
            margin: 0 auto;
            padding: 16px 16px 110px
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px
        }

        h1 {
            font-size: 23px;
            margin: 0
        }

        h2 {
            font-size: 19px;
            margin: 0 0 8px
        }

        p {
            margin: 0 0 10px
        }

        .mute {
            color: var(--mute);
            font-size: 15px
        }

        .pill {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 99px;
            padding: 5px 13px;
            font-size: 14px;
            color: var(--ink)
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: 0 6px 22px rgba(0, 0, 0, .06);
            animation: up .35s ease both
        }

        @keyframes up {
            from {
                opacity: 0;
                transform: translateY(10px)
            }
        }

        input,
        textarea,
        select {
            width: 100%;
            font: inherit;
            padding: 13px;
            border-radius: 14px;
            border: 2px solid var(--line);
            background: var(--in);
            color: var(--ink);
            margin-bottom: 8px
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--acc)
        }

        button {
            font: inherit;
            cursor: pointer;
            border: 0;
            border-radius: 14px;
            padding: 11px 16px;
            background: var(--acc2);
            color: var(--ink);
            transition: transform .12s
        }

        button:active {
            transform: scale(.95)
        }

        button.big {
            width: 100%;
            background: linear-gradient(135deg, var(--acc), #2f7d9a);
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            padding: 18px;
            margin-top: 8px;
            box-shadow: 0 8px 20px rgba(63, 143, 107, .35)
        }

        button.sec {
            border: 1px solid var(--line);
            background: transparent
        }

        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 8px 0
        }

        .chip {
            border: 2px solid var(--line);
            background: transparent;
            padding: 7px 13px;
            border-radius: 99px
        }

        .chip.on {
            border-color: var(--acc);
            background: var(--acc2)
        }

        .garden {
            font-size: 30px;
            line-height: 1.3;
            min-height: 46px;
            word-break: break-all
        }

        .garden span {
            display: inline-block;
            animation: pop .5s ease both
        }

        @keyframes pop {
            from {
                transform: scale(0)
            }
        }

        .bar {
            height: 10px;
            border-radius: 9px;
            background: var(--line);
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--warm);
            transition: width .5s
        }

        .ring {
            position: relative;
            width: 230px;
            height: 230px;
            margin: 4px auto
        }

        .ring svg {
            transform: rotate(-90deg)
        }

        .ring .t {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            font-weight: 700
        }

        .ring small {
            font-size: 14px;
            font-weight: 400;
            color: var(--mute)
        }

        .step {
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin: 6px 0
        }

        .dots {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 6px
        }

        .dots b {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--line)
        }

        .dots b.d {
            background: var(--acc)
        }

        .dots b.c {
            background: var(--warm)
        }

        .row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px
        }

        .msg {
            text-align: center;
            color: var(--acc);
            min-height: 26px;
            font-weight: 600
        }

        .pulse {
            animation: pl 1s infinite
        }

        @keyframes pl {
            50% {
                opacity: .4
            }
        }

        .fab {
            position: fixed;
            right: 14px;
            bottom: calc(86px + env(safe-area-inset-bottom, 0px));
            background: var(--warm);
            color: #222;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
            z-index: 5
        }

        .lot {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--card);
            backdrop-filter: blur(14px);
            border-top: 1px solid var(--line);
            padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
            max-height: 70%;
            overflow: auto;
            z-index: 20;
            box-shadow: 0 -8px 24px rgba(0, 0, 0, .2)
        }

        nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            gap: 4px;
            padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
            background: var(--card);
            backdrop-filter: blur(14px);
            border-top: 1px solid var(--line);
            z-index: 10
        }

        nav button {
            flex: 1;
            max-width: 100px;
            background: transparent;
            font-size: 12px;
            padding: 6px 2px;
            color: var(--mute)
        }

        nav button b {
            display: block;
            font-size: 22px
        }

        nav button.on {
            background: var(--acc2);
            color: var(--ink)
        }

        .hide {
            display: none !important
        }

        .task {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--line)
        }

        .task span {
            flex: 1
        }

        .task .x {
            background: transparent;
            color: var(--mute);
            padding: 4px 9px;
            font-size: 18px;
            border-radius: 99px
        }

        .task .x:hover {
            background: var(--acc2);
            color: var(--ink)
        }

        .task.gone {
            opacity: 0;
            transform: translateX(30px);
            transition: .25s
        }

        .task input {
            width: 22px;
            height: 22px;
            margin: 0
        }

        .task.dn span {
            text-decoration: line-through;
            color: var(--mute)
        }

        .fc {
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 21px;
            font-weight: 600;
            background: var(--acc2);
            border-radius: 18px;
            padding: 18px;
            margin: 10px 0
        }

        .heat {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px
        }

        .heat i {
            aspect-ratio: 1;
            border-radius: 7px;
            background: var(--line)
        }

        .br {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            margin: 22px auto 10px;
            background: radial-gradient(circle at 35% 30%, #8fe3bd, var(--acc) 55%, #2f7d9a);
            transform: scale(.7);
            transition: transform 4s cubic-bezier(.45, 0, .25, 1);
            box-shadow: 0 0 0 14px rgba(92, 194, 147, .15), 0 0 50px rgba(63, 143, 200, .35);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 17px;
            text-align: center
        }

        .bt {
            font-size: 22px;
            font-weight: 700;
            min-height: 34px;
            color: var(--acc);
            margin-bottom: 10px
        }

        .cf {
            position: fixed;
            pointer-events: none;
            font-size: 26px;
            z-index: 50;
            animation: fall 1.2s ease-out forwards
        }

        @keyframes fall {
            to {
                transform: translate(var(--x), -160px) rotate(300deg);
                opacity: 0
            }
        }

        .av {
            font-size: 24px
        }

        @media (prefers-reduced-motion:reduce) {

            .cf,
            .card,
            .garden span,
            .pulse,
            body::before {
                animation: none !important
            }
        }

        html {
            scroll-behavior: smooth
        }

        body::before {
            content: "";
            position: fixed;
            inset: -20%;
            z-index: -1;
            background: radial-gradient(circle at 20% 25%, rgba(92, 194, 147, .25), transparent 35%), radial-gradient(circle at 80% 70%, rgba(242, 185, 75, .22), transparent 35%), radial-gradient(circle at 60% 15%, rgba(120, 150, 255, .18), transparent 30%);
            animation: drift 22s ease-in-out infinite alternate
        }

        @keyframes drift {
            to {
                transform: translate(4%, 3%) scale(1.08)
            }
        }

        .card {
            transition: transform .25s ease, box-shadow .25s ease
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, .1)
        }

        .card:nth-child(2) {
            animation-delay: .07s
        }

        .card:nth-child(3) {
            animation-delay: .14s
        }

        .card:nth-child(4) {
            animation-delay: .21s
        }

        button:hover {
            filter: brightness(1.06);
            transform: translateY(-1px)
        }

        button:active {
            transform: scale(.95)
        }

        .garden span {
            cursor: pointer;
            transition: transform .25s cubic-bezier(.3, 1.6, .5, 1)
        }

        .garden span:hover {
            transform: scale(1.5) rotate(-10deg)
        }

        .bump {
            animation: bump .4s
        }

        @keyframes bump {
            40% {
                transform: scale(1.35)
            }
        }

        nav button {
            transition: background .25s, transform .2s
        }

        nav button.on b {
            animation: hop .4s
        }

        @keyframes hop {
            40% {
                transform: translateY(-6px)
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <h1>🪺 FocusNest</h1>
            <div style="display:flex;gap:8px"><span class="pill" id="xp"></span><button class="pill"
                    onclick="theme()">🌓</button></div>
        </header>
        <div id="v"></div>
        <p class="mute" style="text-align:center;margin:18px 0 0">Made with LOVE ❤️ by Rayen To Amouna</p>
    </div>
    <button class="fab hide" id="lotb" onclick="$('lot').classList.remove('hide')">🅿 Park a thought</button>
    <div class="lot hide" id="lot"><b>Distraction parking lot</b>
        <p class="mute">Write it down. It’s safe. You’ll get it back on your break.</p><input id="lotin"
            placeholder="Stray thought…" onkeydown="if(event.key=='Enter')park()">
        <div class="row"><button onclick="park()" style="background:var(--acc);color:#fff">Park it</button><button
                class="sec" onclick="$('lot').classList.add('hide')">Back to focus</button></div>
        <ul id="lotul"></ul>
    </div>
    <nav id="nav"></nav>
    <script>
        var $ = function (i) { return document.getElementById(i) };
        var S = { xp: 0, min: 0, steps: 0, days: [], len: 10, rough: false, en: '', log: {}, hours: {}, tasks: [] };
        try { var r = localStorage.getItem('fn2'); if (r) S = Object.assign(S, JSON.parse(r)) } catch (e) { }
        function save() { try { localStorage.setItem('fn2', JSON.stringify(S)) } catch (e) { } }
        function dk(d) { d = d || new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) }
        function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c] }) }
        function theme() { var d = document.documentElement, dark = getComputedStyle(d).getPropertyValue('--in').trim() === '#1a2128'; d.setAttribute('data-theme', dark ? 'light' : 'dark') }
        function boom() { var e = ['🎉', '✨', '🌟', '🌸', '🍀']; for (var i = 0; i < 14; i++) { var s = document.createElement('span'); s.className = 'cf'; s.textContent = e[i % 5]; s.style.left = (30 + Math.random() * 40) + '%'; s.style.top = '55%'; s.style.setProperty('--x', (Math.random() * 240 - 120) + 'px'); document.body.appendChild(s); setTimeout(function (x) { x.remove() }.bind(0, s), 1300) } }
        var TP = '', PL = ['🌱', '🌿', '🌷', '🌻', '🌳', '🦋', '🍄', '🌼', '🐝', '🐞'], T = 'focus', steps = [], cur = 0, tick = null, endT = 0, total = 1, left = 1, running = false, warned = false, lot = [], room = null, N = null, BT = null;
        var TABS = [['focus', '🎯', 'Focus'], ['plan', '🗓', 'Plan'], ['nest', '📊', 'Nest'], ['calm', '🫧', 'Calm']];
        $('nav').innerHTML = TABS.map(function (t) { return '<button data-t="' + t[0] + '" onclick="tab(\'' + t[0] + '\')"><b>' + t[1] + '</b>' + t[2] + '</button>' }).join('');
        function tab(t) {
            clearTimeout(BT); BT = null; clearInterval(tick); running = false; stopRoom(); T = t; $('lotb').classList.toggle('hide', t !== 'sess'); $('lot').classList.add('hide'); $('nav').classList.toggle('hide', t === 'sess');
            document.querySelectorAll('nav button').forEach(function (b) { b.classList.toggle('on', b.dataset.t === t) });
            $('v').innerHTML = V[t](); window.scrollTo(0, 0); $('xp').textContent = S.xp + ' XP'; if (A[t]) A[t]()
        }
        var V = {}, A = {};
        // ---------- FOCUS ----------
        var ENT = { low: 'Low energy: do an easy win. Organise your notes or tidy your desk.', mid: 'Medium energy: practice questions are a great fit.', high: 'High energy: tackle your hardest, newest material now!' };
        V.focus = function () {
            var lv = Math.floor(S.xp / 50), g = ''; for (var i = 0; i < Math.min(lv + 1, 30); i++)g += '<span style="animation-delay:' + i * 40 + 'ms">' + PL[i % 10] + '</span>';
            return '<div class="card"><h2>How’s your energy?</h2><div class="chips">' + [['low', '🪫 Low'], ['mid', '🔋 Medium'], ['high', '⚡ High']].map(function (e) { return '<button class="chip' + (S.en == e[0] ? ' on' : '') + '" onclick="S.en=\'' + e[0] + '\';if(!S.rough)S.len={low:5,mid:10,high:25}[S.en];save();tab(\'focus\')">' + e[1] + '</button>' }).join('') + '</div><p class="mute">' + (ENT[S.en] || 'Optional 2-second check-in. It helps me suggest the right task.') + '</p></div>' +
                '<div class="card"><h2>What are you studying?</h2><input id="topic" aria-label="What are you studying" value="' + esc(TP) + '" oninput="TP=this.value" placeholder="e.g. biology exam, chapter 4 maths" onkeydown="if(event.key==\'Enter\')go()"><div class="chips">' + [5, 10, 15, 25].map(function (m) { return '<button class="chip' + (S.len == m && !S.rough ? ' on' : '') + '" onclick="S.len=' + m + ';S.rough=false;save();tab(\'focus\')">' + m + ' min</button>' }).join('') + '<button class="chip' + (S.rough ? ' on' : '') + '" onclick="S.rough=!S.rough;save();tab(\'focus\')">🌧 Rough day</button></div><button class="big" onclick="go()">Start Now</button><p class="mute" style="margin:10px 0 0">I’ll shred it into tiny steps and show only one.</p></div>' +
                '<div class="card"><h2>Your garden</h2><div class="garden">' + g + '</div><div class="bar"><i style="width:' + (S.xp % 50) * 2 + '%"></i></div><p class="mute" style="margin:8px 0 0">Level ' + (lv + 1) + ' · ' + S.min + ' focus min · ' + S.days.length + ' days practised (never resets)</p></div>'
        };
        function shred(t) {
            var q = (t || '').trim().replace(/^(study|revise|learn|do|finish)\s+(for\s+)?/i, '') || 'my study';
            return [['Open your materials for “' + q + '” and put your phone out of reach', 2], ['Skim only the headings or first lines. Don’t read yet', 3], ['Pick ONE small part and read it, highlighting 3 key terms', 8], ['Write one sentence that sums up what you read', 3], ['Close the notes and recall 3 things from memory', 5], ['Fix what you missed, then you’re done', 4]].map(function (a) { return { t: a[0], m: a[1] } })
        }
        function go() { steps = shred(TP); if (S.rough) steps = steps.slice(0, 2); cur = 0; lot = []; $('lotul').innerHTML = ''; tab('sess') }
        V.sess = function () { return '<div class="card"><div class="dots" id="dots"></div><div class="mute" style="text-align:center" id="stepno"></div><div class="step" id="step"></div><div class="ring"><svg width="230" height="230"><circle cx="115" cy="115" r="100" fill="none" stroke="var(--line)" stroke-width="14"/><circle id="arc" cx="115" cy="115" r="100" fill="none" stroke="var(--acc)" stroke-width="14" stroke-linecap="round" stroke-dasharray="628.3"/></svg><div class="t"><span id="clock"></span><small id="est"></small></div></div><div class="msg" id="msg"></div><div class="row"><button id="startb" onclick="start()" style="background:var(--acc);color:#fff;font-weight:700">▶ Start</button><button class="sec" onclick="finishStep()">✓ Done</button><button class="sec" onclick="shrink()">Too big? Shrink it</button></div><div class="row"><button class="sec" id="roomb" onclick="toggleRoom()">👥 Study room</button><button class="sec" style="font-size:14px" onclick="tab(\'focus\')">← Pause (no guilt)</button></div><div id="room" class="hide" style="text-align:center;margin-top:12px"></div></div>' };
        A.sess = function () { load() };
        function load() {
            var s = steps[cur], secs = Math.min(s.m, S.rough ? 5 : S.len) * 60; total = left = secs; warned = false; running = false; clearInterval(tick);
            $('step').textContent = s.t; $('stepno').textContent = 'Step ' + (cur + 1) + ' of ' + steps.length; $('est').textContent = 'about ' + Math.round(secs / 60) + ' min'; $('startb').textContent = '▶ Start'; $('msg').textContent = 'Just start. You can stop after this step.'; $('msg').classList.remove('pulse');
            $('dots').innerHTML = steps.map(function (_, i) { return '<b class="' + (i < cur ? 'd' : i == cur ? 'c' : '') + '"></b>' }).join(''); draw()
        }
        function draw() { $('clock').textContent = Math.floor(Math.ceil(left) / 60) + ':' + ('0' + Math.ceil(left) % 60).slice(-2); $('arc').style.strokeDashoffset = 628.3 * (1 - left / total) }
        function chime() { try { var c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = 528; g.gain.setValueAtTime(.001, c.currentTime); g.gain.exponentialRampToValueAtTime(.15, c.currentTime + .1); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + 1.2); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 1.3); setTimeout(function () { c.close() }, 1500) } catch (e) { } }
        function xp(n) { S.xp += n; var e = $('xp'); e.textContent = S.xp + ' XP'; e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump') }
        function start() {
            if (running) { running = false; clearInterval(tick); left = Math.max(0, (endT - Date.now()) / 1000); $('startb').textContent = '▶ Resume'; return }
            if (left <= 0) { left = total; warned = false }
            if (left == total) { var d = dk(); if (S.days.indexOf(d) < 0) S.days.push(d); xp(5); save(); $('msg').textContent = '+5 XP for starting. That’s the hard part!' }
            running = true; endT = Date.now() + left * 1000; $('startb').textContent = '❚❚ Pause';
            tick = setInterval(function () {
                left = (endT - Date.now()) / 1000;
                if (left <= 60 && !warned && total > 90) { warned = true; $('msg').textContent = 'One minute left. Start wrapping up gently.'; $('msg').classList.add('pulse') }
                if (left <= 0) { left = 0; clearInterval(tick); running = false; draw(); chime(); $('msg').textContent = 'Time’s up! Tap Done if you finished.'; $('msg').classList.remove('pulse'); $('startb').textContent = '▶ Again'; return } draw()
            }, 250)
        }
        function shrink() { var s = steps[cur]; if (s.m <= 2) { s.m = 1; load(); $('msg').textContent = 'Already tiny. Just look at it for 1 minute.'; return } steps.splice(cur, 1, { t: 'Just the first 2 minutes of: ' + s.t, m: 2 }, { t: s.t + ' (the rest)', m: Math.max(3, s.m - 2) }); load(); $('msg').textContent = 'Shrunk. Tiny starts are allowed.' }
        function finishStep() {
            var sp = Math.round((total - Math.max(0, left)) / 60), k = dk(), h = new Date().getHours();
            S.min += sp; S.steps++; S.log[k] = (S.log[k] || 0) + sp; if (sp > 0) S.hours[h] = (S.hours[h] || 0) + sp; if (S.days.indexOf(k) < 0) S.days.push(k); var m = '+10 XP', b = 10 + sp;

        function fin() { stopRoom(); $('lotb').classList.add('hide'); $('lot').classList.add('hide'); $('v').innerHTML = '<div class="card" style="text-align:center"><div style="font-size:56px">🎉</div><h2>You showed up. That counts.</h2><p>' + (S.rough ? 'Rough day, and you still did it. Real strength.' : 'All steps done. Your garden grew.') + '</p>' + (lot.length ? '<div class="mute" style="text-align:left"><b>Your parked thoughts:</b><ul>' + lot.map(function (x) { return '<li>' + esc(x) + '</li>' }).join('') + '</ul></div>' : '') + '<p>Break idea: <b>' + ['stretch for 1 minute', 'drink some water', 'walk around the room', '20 jumping jacks', 'look out a window and breathe slowly'][Math.floor(Math.random() * 5)] + '</b></p><button class="big" onclick="tab(\'focus\')">Back to my garden</button></div>'; $('nav').classList.remove('hide') }
        function park() { var v = $('lotin').value.trim(); if (!v) return; lot.push(v); $('lotul').innerHTML += '<li>' + esc(v) + '</li>'; $('lotin').value = '' }
        // body doubling room (simulated presence)
        var CM = ['Still going? Nice. 🙌', 'I’m here with you.', 'Small steps count.', 'Look at you, focused! 🌱', 'Sip of water?'];
        function toggleRoom() {
            if (room) { stopRoom(); return } $('room').classList.remove('hide'); var n = 12 + Math.floor(Math.random() * 25);
            function up() { n = Math.max(5, n + Math.floor(Math.random() * 5) - 2); $('room').innerHTML = '<div class="av">' + ['🧑‍🎓', '👩‍💻', '🧑‍🎨', '👨‍🔬', '🦊', '🐼'].slice(0, 3 + n % 4).join(' ') + '</div><p class="mute" style="margin:4px 0">' + n + ' people studying quietly (simulated room)</p><p style="color:var(--acc);font-weight:600">' + CM[Math.floor(Date.now() / 20000) % 5] + '</p>' } up(); room = setInterval(up, 20000)

        function stopRoom() { clearInterval(room); room = null; if ($('room')) $('room').classList.add('hide') }
        // ---------- PLAN ----------
        function addT(t, d, k) { S.tasks.push({ t: t, d: d || dk(), k: k || 'task', done: false }) }
        V.plan = function () {
            var td = dk(), open = S.tasks.filter(function (x) { return !x.done && x.k == 'task' && x.d <= td }).sort(function (a, b) { return a.d < b.d ? -1 : 1 }).slice(0, 3);
            var lst = function (k, e) { var a = S.tasks.map(function (x, i) { return [x, i] }).filter(function (p) { return p[0].k == k }); return a.length ? a.map(function (p) { return '<div class="task' + (p[0].done ? ' dn' : '') + '"><input type="checkbox" ' + (p[0].done ? 'checked' : '') + ' onchange="tog(' + p[1] + ')"><span>' + esc(p[0].t) + (p[0].d > td ? ' <small class="mute">' + p[0].d + '</small>' : '') + '</span><button class="x" title="Remove" onclick="del(' + p[1] + ',this)">✕</button></div>' }).join('') : '<p class="mute">' + e + '</p>' };
            return '<div class="card"><h2>Today: just these (' + open.length + ')</h2>' + (open.length ? open.map(function (x) { return '<div class="task"><input type="checkbox" onchange="tog(' + S.tasks.indexOf(x) + ')"><span>' + esc(x.t) + '</span><button class="x" title="Remove" onclick="del(' + S.tasks.indexOf(x) + ',this)">✕</button></div>' }).join('') : '<p class="mute">Nothing pressing. Enjoy it, or brain dump below.</p>') + '<p class="mute" style="margin-top:8px">Missed something? It quietly moves here. No problem, let’s adjust.</p></div>' +
                '<div class="card"><h2>🧠 Brain dump</h2><textarea id="dump" rows="3" placeholder="Everything on your mind, one per line"></textarea><button onclick="dump()" style="background:var(--acc);color:#fff">Sort it for me</button></div>' +
                '<div class="card"><h2>⏳ Plan backwards from a deadline</h2><input id="pt" placeholder="Exam or subject"><input id="pd" type="date"><button onclick="back()" style="background:var(--acc);color:#fff">Spread the work (with buffer day)</button></div>' +
                '<div class="card"><h2>All tasks <button class="sec" style="font-size:13px;padding:4px 10px;float:right" onclick="clr()">Clear done</button></h2>' + lst('task', 'No tasks yet.') + '<h2 style="margin-top:12px">📌 Deadlines</h2>' + lst('deadline', 'None.') + '<h2 style="margin-top:12px">💡 Ideas</h2>' + lst('idea', 'None.') + '</div>'
        };
        function del(i, b) { var r = b.parentNode; r.classList.add('gone'); setTimeout(function () { S.tasks.splice(i, 1); save(); tab('plan') }, 250) }

        function back() {

            var st = ['Skim everything once', 'Learn part 1', 'Learn part 2', 'Practice questions', 'Review mistakes'], span = Math.max(1, n - 1);
            st.forEach(function (s, i) { var d = new Date(); d.setDate(d.getDate() + Math.floor(i * span / st.length)); addT(t + ': ' + s, dk(d)) }); addT('Exam: ' + t, e, 'deadline'); save(); tab('plan')
        }
        // ---------- NEST (dashboard + parent mode) ----------
        V.nest = function () {
            var h = '', mx = Math.max(10, Math.max.apply(0, Object.keys(S.log).map(function (k) { return S.log[k] })));
            for (var i = 27; i >= 0; i--) { var d = new Date(); d.setDate(d.getDate() - i); var m = S.log[dk(d)] || 0; h += '<i title="' + dk(d) + ': ' + m + ' min" style="' + (m ? 'background:var(--acc);opacity:' + (.3 + .7 * m / mx) : '') + '"></i>' }
            var best = Object.keys(S.hours).sort(function (a, b) { return S.hours[b] - S.hours[a] })[0], done = S.tasks.filter(function (x) { return x.done }).length;
            var sum = 'FocusNest summary: ' + S.min + ' focus minutes, ' + S.steps + ' steps done, ' + S.days.length + ' days practised, ' + done + ' tasks completed.';
            return '<div class="card"><h2>Last 28 days</h2><div class="heat">' + h + '</div></div><div class="card"><h2>🏆 Wins</h2><p>' + S.steps + ' steps finished · ' + S.min + ' focus minutes · ' + done + ' tasks done</p>' + (best !== undefined ? '<p>You focus best around <b>' + best + ':00</b>.</p>' : '<p class="mute">Do a few sessions and I’ll find your best time.</p>') + '</div><div class="card"><h2>📤 Share your summary</h2><p class="mute">Send your progress to anyone you choose. Parked thoughts and private notes are never included.</p><textarea id="sm" rows="3" readonly>' + sum + '</textarea><div class="row" style="justify-content:flex-start"><button onclick="shareSum()" style="background:var(--acc);color:#fff;font-weight:700">📤 Share</button><button class="sec" onclick="cp()">📋 Copy</button></div><p class="mute" id="shm" style="margin:8px 0 0"></p></div><div class="card"><button class="sec" id="rs" style="font-size:14px" onclick="reset(this)">Reset all my data</button></div>'
        };
        function clr() { S.tasks = S.tasks.filter(function (x) { return !x.done }); save(); tab('plan') }

        function cp() { var t = $('sm'); t.select(); try { navigator.clipboard.writeText(t.value) } catch (e) { try { document.execCommand('copy') } catch (x) { } } }
        function reset(b) { if (b.dataset.s) { try { localStorage.removeItem('fn2') } catch (e) { } location.reload() } else { b.dataset.s = 1; b.textContent = 'Tap again to erase everything'; setTimeout(function () { b.dataset.s = ''; b.textContent = 'Reset all my data' }, 3500) } }
        // ---------- CALM ----------
        var KM = ['Starting again is a skill, and you’re practicing it.', 'Behind isn’t failing. It’s just a starting point.', 'Done is better than perfect. Do the ugly first draft.', 'Your brain works differently, not worse.'], MV = ['Stretch your arms up for 20 seconds', 'Walk to get a glass of water', '20 jumping jacks', 'Shake out your hands and shoulders'];
        V.calm = function () { return '<div class="card" style="text-align:center"><h2>Breathe with the circle</h2><div class="br" id="br">🌬</div><div class="bt" id="bt">Ready when you are</div><div class="row"><button id="bb" onclick="breathe()" style="background:var(--acc);color:#fff;font-weight:700">▶ Start breathing</button><button class="sec" onclick="noise()" id="nb">🎧 Brown noise: ' + (N ? 'on' : 'off') + '</button></div></div><div class="card"><h2>Spiral helper</h2><p id="km">' + KM[0] + '</p><div class="row" style="justify-content:flex-start"><button onclick="$(\'km\').textContent=KM[Math.floor(Math.random()*4)]">Another kind thought</button><button onclick="$(\'km\').textContent=MV[Math.floor(Math.random()*4)]">Movement break</button></div><p class="mute" style="margin-top:12px">On a rough day: use 🌧 Rough day on the Focus tab and do just 5 minutes.</p></div>' };
        function breathe() {
            var el = $('br'), tx = $('bt'), b = $('bb'); if (BT) { clearTimeout(BT); BT = null; el.style.transitionDuration = '1.2s'; el.style.transform = 'scale(.7)'; tx.textContent = 'Nice. Come back anytime.'; b.textContent = '▶ Start breathing'; return }
            b.textContent = '■ Stop'; var ph = [['Breathe in… 🌤', 1.25, 4], ['Hold… ✨', 1.25, 2], ['Breathe out… 🍃', .7, 6]], i = 0;
            (function step() { var p = ph[i % 3]; tx.textContent = p[0]; el.style.transitionDuration = (i % 3 == 1 ? .2 : p[2]) + 's'; el.style.transform = 'scale(' + p[1] + ')'; BT = setTimeout(step, p[2] * 1000); i++ })()
        }

        tab('focus');
